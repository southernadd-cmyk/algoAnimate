name: Lo-fi demo checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'media/**'
      - 'index.html'
      - 'css/**'
      - 'tests/demo*'
      - '.github/workflows/demo-check.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit tests
        run: npm run check && npm test
      - name: Install browser tools
        run: npm install --no-save --package-lock=false playwright@1.64.0 && npx playwright install --with-deps chromium
      - name: Ensure media inspection tools
        run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Fetch and validate CC0 multi-genre demo tracks
        run: bash scripts/fetch-demo-music.sh
      - name: Click-to-play, rotation, recording, mobile and cleanup
        env:
          ALGOANIMATE_DENSE_TAKE: '1'
        run: npm run test:demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lofi-demo-checks
          path: test-results/demo/
          if-no-files-found: ignore
