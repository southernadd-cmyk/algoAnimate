name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: validated-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify vendored AlgoArt against pinned upstream commit
        run: bash scripts/verify-vendor.sh
      - name: Syntax, assets and audio tests
        run: npm run check && npm test
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.64.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Ensure video inspection tools
        run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Browser, audio and recording smoke test
        run: npm run test:browser
      - name: Demo, mixing, performance, print and score replay
        run: npm run test:demo
      - name: Keep screenshots and test take
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.15-smoke-test
          path: test-results/
          if-no-files-found: ignore
  deploy:
    needs: test
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static application
        run: |
          mkdir -p dist
          cp index.html favicon.svg .nojekyll dist/
          cp -R css js fonts vendor media dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
